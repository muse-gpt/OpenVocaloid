[workspace]
resolver = "2"
members = ["crates/napi"]
default-members = ["crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenVocaloid Authors"]
repository = "https://github.com/muse-gpt/vocaloid"

[workspace.dependencies]
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "66f5d003fec85e28503968fd0a6a271beef0f389" }
# The singing-voice domain, the scene-free voice export entry and the shared
# sample rate live in the media.rs tree. The revision is pinned to a full
# 40-character commit so this repo builds from exactly one upstream source.
media-voice = { git = "https://github.com/oovm/boost.rs.git", rev = "cd4c624bae1f55853c3b63403581a42fafa444e7" }
media-render = { git = "https://github.com/oovm/boost.rs.git", rev = "cd4c624bae1f55853c3b63403581a42fafa444e7", default-features = false, features = ["voice-export"] }
media-harness = { git = "https://github.com/oovm/boost.rs.git", rev = "cd4c624bae1f55853c3b63403581a42fafa444e7" }
media-types = { git = "https://github.com/oovm/boost.rs.git", rev = "cd4c624bae1f55853c3b63403581a42fafa444e7" }

[profile.release]
lto = true
panic = "abort"

